code: user_study_c
name: "User study C: stuck sensor hides overheating"
description: >-
  The spindle temperature transmitter on cnc-02 sticks at a normal reading, then the spindle loses
  lubrication. The primary symptom is hidden; only secondary vibration and current changes remain.

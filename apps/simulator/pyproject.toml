[project]
name = "twinvoice-simulator"
version = "0.1.0"
description = "TwinVoice M1 sensor simulator: machines, degradation physics, Sparkplug B / OPC UA / Modbus"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "twinvoice-contracts",
    "simpy>=4.1.1,<5",
    "numpy>=2.3,<3",
    "paho-mqtt>=2.1,<3",
    "asyncua>=2.0.1,<3",
    "pymodbus>=3.15,<4",
    "pyarrow>=21",
    "fastapi>=0.141,<1",
    "uvicorn>=0.53,<1",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2,<7",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.14",
    "pandas>=3",
    "httpx2>=2.13.0",
]

[tool.uv.sources]
twinvoice-contracts = { path = "../../packages/contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

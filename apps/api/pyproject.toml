[project]
name = "twinvoice-api"
version = "0.1.0"
description = "TwinVoice platform API: core, assets, digital twin, simulation control"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "twinvoice-contracts",
    "twinvoice-nlu",
    "twinvoice-xai",
    "alembic>=1.20,<2",
    "basyx-python-sdk>=2.1,<3",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "lightgbm>=4.6,<5",
    "mapie>=0.9,<1",
    "jinja2>=3.1,<4",
    "matplotlib>=3.9,<4",
    "numba>=0.61,<1",
    "numpy>=2.0,<3",
    "ortools>=9.11,<10",
    "paho-mqtt>=2.1,<3",
    "pandas>=2.3,<3",
    "prometheus-client>=0.26,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.15,<3",
    "pyjwt[crypto]>=2.14,<3",
    "python-docx>=1.1,<2",
    "pyyaml>=6.0,<7",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.6,<2",
    "shap>=0.46,<1",
    "sqlalchemy>=2.0.54,<2.1",
    "uvicorn[standard]>=0.53,<1",
    "valkey>=6.1,<7",
    # WeasyPrint needs pango/cairo, which the API image installs; on a host without them the
    # renderer stores HTML instead (see modules/reports/render.py).
    "weasyprint>=62,<67",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.uv.sources]
twinvoice-contracts = { path = "../../packages/contracts", editable = true }
twinvoice-nlu = { path = "../../packages/nlu", editable = true }
twinvoice-xai = { path = "../../packages/xai", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

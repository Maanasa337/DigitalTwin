map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Tokens travel in the /ws/live query string, so access logs record the path only.
log_format noquery '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
  listen 80;
  access_log /var/log/nginx/access.log noquery;
  # Re-resolve the api container on every request so a restarted api does not leave a stale upstream IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  # Grafana is optional; a variable upstream lets nginx start (and serve the app) without it.
  set $grafana_upstream http://grafana:3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  location /ws/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Grafana runs with serve_from_sub_path, so the /grafana/ prefix is forwarded unchanged (a
  # variable proxy_pass without a URI part passes the request URI as-is). Upgrade headers carry
  # Grafana Live's websocket.
  location /grafana/ {
    proxy_pass $grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 3600s;
  }

  location = /grafana {
    # Relative Location, so the redirect keeps the published host port (8088), not nginx's 80.
    absolute_redirect off;
    return 301 /grafana/;
  }

  location = /metrics {
    return 404;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

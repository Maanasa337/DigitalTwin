# TwinVoice login theme. Inherits every template and class mapping from keycloak.v2 (PatternFly 5).
parent=keycloak.v2

# `styles` replaces the parent's value instead of appending to it, so the parent's stylesheet is
# listed first (resolved through the parent chain) and ours overrides it. `stylesCommon`
# (PatternFly) is inherited untouched.
styles=css/styles.css css/twinvoice.css

darkMode=true

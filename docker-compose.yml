name: twinvoice

x-ditto-service: &ditto-service
  restart: unless-stopped
  depends_on:
    mongodb:
      condition: service_started
  networks:
    default:
      aliases:
        - ditto-cluster
  deploy:
    resources:
      limits:
        memory: 512m
  healthcheck:
    test: ["CMD-SHELL", "curl --fail `hostname`:7626/alive || exit 1"]
    interval: 30s
    timeout: 15s
    retries: 4
    start_period: 120s
  logging:
    options:
      max-size: 20m

x-ditto-env: &ditto-env
  TZ: UTC
  BIND_HOSTNAME: 0.0.0.0
  MONGO_DB_HOSTNAME: mongodb
  JAVA_TOOL_OPTIONS: >-
    -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:+UseStringDeduplication
    -Xss512k -XX:MaxRAMPercentage=50 -XX:+UseG1GC -XX:MaxGCPauseMillis=150
    -Dpekko.coordinated-shutdown.exit-jvm=on -Dpekko.cluster.shutdown-after-unsuccessful-join-seed-nodes=180s
    -Dpekko.cluster.failure-detector.threshold=15.0 -Dpekko.cluster.failure-detector.expected-response-after=10s
    -Dpekko.cluster.failure-detector.acceptable-heartbeat-pause=20s -Dpekko.cluster.downing-provider-class=

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: twinvoice
      POSTGRES_PASSWORD: twinvoice
      POSTGRES_DB: twinvoice
    ports:
      - "127.0.0.1:${TV_PG_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twinvoice -d twinvoice"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    command: mongod --storageEngine wiredTiger --noscripting
    deploy:
      resources:
        limits:
          memory: 384m
    volumes:
      - mongo-data:/data/db

  ditto-policies:
    <<: *ditto-service
    image: eclipse/ditto-policies:${DITTO_VERSION:-3.9.0}
    environment: *ditto-env

  ditto-things:
    <<: *ditto-service
    image: eclipse/ditto-things:${DITTO_VERSION:-3.9.0}
    environment: *ditto-env

  ditto-things-search:
    <<: *ditto-service
    image: eclipse/ditto-things-search:${DITTO_VERSION:-3.9.0}
    environment: *ditto-env

  ditto-gateway:
    <<: *ditto-service
    image: eclipse/ditto-gateway:${DITTO_VERSION:-3.9.0}
    environment:
      <<: *ditto-env
      # Only the API on the internal network talks to Ditto; the gateway port is not published in this file.
      ENABLE_PRE_AUTHENTICATION: "true"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      # start-dev disables the theme cache, so edits under themes/ show on the next page load.
      - ./infra/keycloak/themes/twinvoice:/opt/keycloak/themes/twinvoice:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      TV_DATABASE_URL: postgresql+psycopg://twinvoice:twinvoice@postgres:5432/twinvoice
      TV_VALKEY_URL: redis://valkey:6379/0
      TV_MQTT_HOST: mosquitto
      TV_DITTO_URL: http://ditto-gateway:8080
      TV_KEYCLOAK_ISSUER: http://localhost:8081/realms/twinvoice
      TV_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      TV_SIMULATOR_URL: http://simulator:8090
      TV_ALLOW_T3: ${TV_ALLOW_T3:-false}
      # Password Alembic 0010 gives the grafana_ro role; Grafana's datasource reads the same variable.
      TV_GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro}
      TV_LLM_ENDPOINT: ${TV_LLM_ENDPOINT:-}
    volumes:
      - ./data/reports:/app/apps/api/data/reports
      - ./data/models:/data/models
      - ./data/raw:/data/raw:ro
      - ./data/benchmarks:/data/benchmarks
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mosquitto:
        condition: service_started
      keycloak:
        condition: service_started
      ditto-gateway:
        condition: service_started

  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    restart: unless-stopped
    environment:
      SIM_MQTT_HOST: mosquitto
      SIM_EXPORT_DIR: /data/synthetic
    ports:
      - "127.0.0.1:4840:4840"
      - "127.0.0.1:5020:5020"
    volumes:
      - ./data:/data
    depends_on:
      - mosquitto

  web:
    build: ./apps/web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api

  # Optional engineer dashboards (anonymous Viewer), served under /grafana/ and proxied by web.
  # Needs the grafana_ro role from Alembic 0010, which the api applies on start.
  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION:-13.0.2}
    restart: unless-stopped
    environment:
      # Absolute URL used for redirects and links; the UI itself uses only the /grafana/ path, so
      # direct access on :3000 keeps working. Change it if the web port is not 8088.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8088/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana Live checks the websocket Origin against root_url; also allow Vite dev and direct :3000.
      GF_LIVE_ALLOWED_ORIGINS: http://localhost:5173, http://localhost:3000
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/fleet-overview.json
      # No outbound calls: telemetry, update checks, news feed, plugin pre-installs.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/grafana/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ingest:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.ingest"]
    # Inherited from the API image, whose healthcheck probes an HTTP port this service never opens.
    healthcheck:
      disable: true
    environment:
      TV_DATABASE_URL: postgresql+psycopg://twinvoice:twinvoice@postgres:5432/twinvoice
      TV_VALKEY_URL: redis://valkey:6379/0
      TV_MQTT_HOST: mosquitto
      TV_DITTO_URL: http://ditto-gateway:8080
      TV_KEYCLOAK_ISSUER: http://localhost:8081/realms/twinvoice
      TV_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mosquitto:
        condition: service_started
      ditto-gateway:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Beat's shelve file must live somewhere the unprivileged `app` user can write; the default is
    # the read-only working directory, where it dies on startup and takes every periodic task with it.
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --beat
      - --schedule=/data/celery/celerybeat-schedule
      - -l
      - info
      - -c
      - "2"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TV_DATABASE_URL: postgresql+psycopg://twinvoice:twinvoice@postgres:5432/twinvoice
      TV_VALKEY_URL: redis://valkey:6379/0
      TV_MQTT_HOST: mosquitto
      TV_DITTO_URL: http://ditto-gateway:8080
      TV_KEYCLOAK_ISSUER: http://localhost:8081/realms/twinvoice
      TV_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      TV_LLM_ENDPOINT: ${TV_LLM_ENDPOINT:-}
    volumes:
      - ./data/reports:/app/apps/api/data/reports
      - ./data/models:/data/models
      - ./data/raw:/data/raw:ro
      - ./data/benchmarks:/data/benchmarks
      # Simulator exports (written by the simulator service) for `make train`.
      - ./data/synthetic:/data/synthetic:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # M11 edge runner: ONNX inference + TreeSHAP next to the machines, publishing twinvoice/pred/{asset}.
  # Opt-in: `docker compose --profile edge up -d edge` (or `make edge`) after `make train`.
  edge:
    profiles: ["edge"]
    build:
      context: .
      dockerfile: apps/edge/Dockerfile
    restart: unless-stopped
    environment:
      EDGE_MQTT_HOST: mosquitto
      EDGE_ASSETS: ${EDGE_ASSETS:-cnc-01,compressor-01,conveyor-01,press-01,moulder-01}
      EDGE_MODEL_DIR: /models
      EDGE_BUFFER_PATH: /edge/buffer.sqlite
      EDGE_LOG_PATH: /edge/latency.csv
    volumes:
      - ./data/models:/models:ro
      - ./data/edge:/edge
    depends_on:
      - mosquitto

volumes:
  pgdata:
  mosquitto-data:
  mongo-data:
  grafana-data:

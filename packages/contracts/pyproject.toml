[project]
name = "twinvoice-contracts"
version = "0.1.0"
description = "Shared message contracts for TwinVoice (Sparkplug B codec and topics)"
requires-python = ">=3.12,<3.13"
license = "MIT"
# The Sparkplug stubs are generated for protobuf 6.31 gencode, which every 6.x and 7.x runtime
# accepts. Pinning to 7 instead made this package unusable alongside ortools (M7), which caps
# protobuf below 6.34 — regenerate with grpcio-tools if the floor ever has to move.
dependencies = ["protobuf>=6.31,<8", "pydantic>=2.11,<3"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinvoice_contracts"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/twinvoice_contracts/sparkplug/sparkplug_b_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

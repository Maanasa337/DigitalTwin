[project]
name = "twinvoice-nlu"
version = "0.1.0"
description = "Natural-language understanding for VoiceNav: intent schemas, hybrid router, slots, risk tiers, grounded narration"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0,<7",
    "rapidfuzz>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinvoice_nlu"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

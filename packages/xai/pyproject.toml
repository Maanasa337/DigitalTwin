[project]
name = "twinvoice-xai"
version = "0.1.0"
description = "Explainable AI: attributions, glass-box second opinion, reason cards, counterfactuals, narration and audit"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.3,<3",
    "scikit-learn>=1.6,<2",
    "shap>=0.46,<1",
    # shap pulls numba, and the resolver otherwise picks an llvmlite that refuses Python 3.12.
    # apps/api pins this too; both have to, because each resolves its own lock.
    "numba>=0.61,<1",
    "interpret-core>=0.6,<1",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinvoice_xai"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
